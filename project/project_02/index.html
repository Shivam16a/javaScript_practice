<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        .container{
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .clock{
            width: 200px;
            height: 50px;
            background-color: rgb(255, 179, 0);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #time{
            font-size: 30px;
        }
    </style>
</head>
<body style="background-color: black;">
    <div class="container">
        <div class="info">
            <h1 style="color: white;">Digital Clock</h1>
        </div>
        <div class="clock"></div>
    </div>
    <script src="./clock.js"></script>
</body>
</html>
